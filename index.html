<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a2a5e" />
  <title>Bessa Refrigeração</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #edf5fc;
      --card: #fff;
      --text: #0d2137;
      --muted: #5a7390;
      --primary: #087fc4;
      --primary-dark: #064c87;
      --primary-light: #e3f5ff;
      --accent: #00c5ef;
      --sidebar: #06285a;
      --sidebar-text: #a8c4e0;
      --border: #d6e4f0;
      --success: #0d9f6e;
      --warning: #e67e22;
      --danger: #c0392b;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(10,42,94,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.45}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer;border:none;background:none}
    a{color:inherit;text-decoration:none}
    .app{display:flex;min-height:100vh}
    .sidebar{width:260px;background:linear-gradient(180deg,#0a2a5e 0%,#071e45 100%);color:#fff;padding:22px 14px;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:100;transition:transform .25s ease}
    .brand{display:flex;align-items:center;gap:12px;padding:4px 10px 26px}
    .brand-icon{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#00b4ff,#0077cc);display:grid;place-items:center;font-size:22px;box-shadow:0 0 0 3px rgba(0,180,255,.25);flex-shrink:0}
    .brand strong{display:block;font-size:20px;letter-spacing:1.5px;background:linear-gradient(90deg,#fff,#a8d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .brand span{display:block;font-size:10px;letter-spacing:2px;color:#7eb8e8;margin-top:1px;font-weight:600}
    .nav{display:grid;gap:5px;flex:1}
    .nav-btn{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;color:var(--sidebar-text);font-size:13px;font-weight:600;text-align:left;transition:.15s}
    .nav-btn:hover,.nav-btn.active{background:rgba(0,180,255,.12);color:#fff}
    .nav-btn.active{box-shadow:inset 3px 0 #00b4ff;background:rgba(0,180,255,.18)}
    .nav-btn svg{width:20px;height:20px;flex-shrink:0}
    .sidebar-footer{padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#6a91b8;line-height:1.5}
    .main{margin-left:260px;flex:1;min-height:100vh}
    .topbar{height:76px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:50}
    .topbar h1{font-size:19px;font-weight:700}
    .eyebrow{font-size:10px;letter-spacing:1.6px;color:var(--muted);font-weight:700;display:block;margin-bottom:2px}
    .menu-toggle{display:none;width:40px;height:40px;border-radius:10px;background:var(--primary-light);color:var(--primary);place-items:center;font-size:18px}
    .content{max-width:1160px;margin:0 auto;padding:26px 28px 60px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:700;transition:.15s}
    .btn-primary{background:linear-gradient(135deg,#00a0e8,#0077cc);color:#fff;box-shadow:0 3px 10px rgba(0,119,204,.25)}
    .btn-primary:hover{filter:brightness(1.08)}
    .btn-secondary{background:#e8f1fa;color:#1a4a7a}
    .btn-secondary:hover{background:#d6e8f7}
    .btn-danger{background:#fdecea;color:var(--danger);margin-top:12px;width:100%}
    .btn-danger:hover{background:#fadbd8}
    .btn-sm{padding:8px 13px;font-size:12px}
    .btn-location{background:#e6f4fc;color:var(--primary);border:1.5px dashed #8ec8f0;width:100%;margin-top:4px;font-weight:600}
    .btn-location:hover{background:#d4ecfa}
    .btn-location.captured{background:#e3f8ef;color:var(--success);border-color:#8ed9b5;border-style:solid}
    .btn-reset{background:#fff5e6;color:#c47a00;border:1px solid #f0d4a0;font-size:12px;padding:8px 14px}
    .btn-reset:hover{background:#ffefd4}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
    .stat-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex-shrink:0}
    .stat-icon.blue{background:#e0f0ff}.stat-icon.orange{background:#fff0e0}.stat-icon.green{background:#e0f7ee}
    .stat span{display:block;font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:22px;margin-top:2px}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:14px;flex-wrap:wrap}
    .section-head h2,.section-head h3{font-size:17px}.section-head p{font-size:13px;color:var(--muted);margin-top:2px}
    .list{display:grid;gap:10px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px 17px;display:flex;align-items:center;gap:15px;cursor:pointer;transition:.15s;text-align:left;width:100%;box-shadow:var(--shadow)}
    .card:hover{border-color:#a8cce8;box-shadow:0 6px 18px rgba(0,119,204,.1)}
    .date-block{width:48px;text-align:center;flex-shrink:0}
    .date-block strong{display:block;font-size:22px;line-height:1;color:var(--primary)}
    .date-block span{display:block;font-size:11px;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:600}
    .card-body{flex:1;min-width:0}
    .card-title{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
    .card-title h4{font-size:15px;font-weight:700}
    .card-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:5px}
    .card-meta span{display:inline-flex;align-items:center;gap:3px}
    .status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
    .status-saved{background:#f0f0f5;color:#5a6a7a}
    .status-scheduled{background:#e0f0ff;color:#0077cc}
    .status-in_progress{background:#fff0e0;color:#d4780a}
    .status-completed{background:#e0f7ee;color:#0d9f6e}
    .status-cancelled{background:#f0f0f0;color:#777}
    .employee-tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef4fb;color:#3a6a9a}
    .empty{text-align:center;padding:48px 20px;background:var(--card);border:1.5px dashed var(--border);border-radius:var(--radius)}
    .empty h3{margin:12px 0 6px}.empty p{color:var(--muted);font-size:14px;margin-bottom:16px}
    .toolbar{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
    .search{flex:1;min-width:180px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:0 14px;box-shadow:var(--shadow)}
    .search input{border:none;outline:none;padding:12px 0;width:100%;background:transparent}
    .modal-bg{position:fixed;inset:0;background:rgba(7,30,69,.45);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:12px}
    .modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:slideUp .25s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:5}
    .modal-header h2{font-size:17px}
    .modal-body{padding:18px 20px 24px}
    .close-btn{width:36px;height:36px;border-radius:9px;background:#eef4fb;display:grid;place-items:center;font-size:18px;color:var(--muted)}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field.full{grid-column:1/-1}
    .field label{font-size:12px;font-weight:600;color:#3a5a7a}
    .field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:11px 12px;background:#f7fafd;outline:none;transition:border .15s}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(0,119,204,.12)}
    .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;grid-column:1/-1}
    .geo-info{font-size:12px;color:var(--success);margin-top:6px;padding:9px 11px;background:#eaf8f2;border-radius:8px;display:none;line-height:1.45}
    .geo-info.show{display:block}
    .detail-line{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #eef3f8}
    .detail-line:last-of-type{border-bottom:none}
    .detail-line small{display:block;font-size:11px;color:var(--muted)}
    .detail-line span{font-size:14px;font-weight:500}
    .progress-bar{height:6px;background:#e4eef7;border-radius:4px;overflow:hidden;margin:8px 0 14px}
    .progress-bar div{height:100%;background:linear-gradient(90deg,#00b4ff,#0077cc);border-radius:4px;transition:width .3s}
    .check-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card);width:100%;text-align:left;transition:.15s}
    .check-item.checked{background:#f0faf5;border-color:#b0e0c8}
    .check-item .check{width:22px;height:22px;border-radius:50%;border:2px solid #b8cdda;display:grid;place-items:center;flex-shrink:0;font-size:12px;color:transparent}
    .check-item.checked .check{background:var(--success);border-color:var(--success);color:#fff}
    .check-item span{flex:1;font-size:14px}
    .check-item small{font-size:11px;color:var(--success)}
    .route-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
    .route-pin{width:40px;height:40px;border-radius:11px;background:#e0f0ff;color:var(--primary);display:grid;place-items:center;font-size:18px;flex-shrink:0}
    .route-info{flex:1;min-width:0}
    .route-info strong{display:block;font-size:14px}
    .route-info span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
    .route-info small{font-size:12px;color:#8aa0b8}
    .select-wrap{margin-bottom:18px}
    .select-wrap select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-weight:500}
    .pay-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
    .pay-card h3{font-size:15px;margin-bottom:10px}
    .pay-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid #eef3f8}
    .pay-row:last-child{border-bottom:none}
    .pay-row .label{color:var(--muted)}
    .pay-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:2px solid #e0eaf4;font-size:15px;font-weight:700}
    .pay-total .value{color:var(--success);font-size:22px}
    .pay-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.55}
    .period-badge{display:inline-block;background:linear-gradient(135deg,#e0f0ff,#d0e8ff);color:var(--primary);font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;margin-bottom:10px}
    .employee-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
    .employee-tabs button{padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;background:#e8f1fa;color:#3a6a9a;transition:.15s}
    .employee-tabs button.active{background:linear-gradient(135deg,#00a0e8,#0077cc);color:#fff;box-shadow:0 2px 8px rgba(0,119,204,.3)}
    .perm-banner{background:linear-gradient(135deg,#fff5e0,#fff0d0);border:1px solid #f0d4a0;border-radius:12px;padding:14px 16px;margin-bottom:18px;display:none;align-items:center;gap:12px;font-size:13px}
    .perm-banner.show{display:flex}
    .perm-banner button{background:#c47a00;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;white-space:nowrap}
    @media(max-width:800px){
      .sidebar{transform:translateX(-100%)}
      .sidebar.open{transform:translateX(0)}
      .main{margin-left:0}
      .menu-toggle{display:grid}
      .topbar{padding:0 14px;height:68px}
      .content{padding:18px 14px 80px}
      .stats{grid-template-columns:1fr}
      .form-grid{grid-template-columns:1fr}
      .modal{border-radius:16px;max-height:90vh}
      .modal-bg{align-items:center}
    }
    .overlay{display:none;position:fixed;inset:0;background:rgba(7,30,69,.4);z-index:90}
    .overlay.show{display:block}
  
    .type-opt{display:flex;flex-direction:column;gap:2px;padding:12px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;background:#f7fafd;transition:.15s;position:relative}
    .type-opt:has(input:checked),.type-opt.active{border-color:var(--primary);background:var(--primary-light);box-shadow:0 0 0 3px rgba(0,119,204,.1)}
    .type-opt input[type=radio]{position:absolute;opacity:0.01;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer;z-index:2}
    .type-opt span{font-size:13px;font-weight:700;color:var(--text);position:relative;z-index:1}
    .type-opt small{font-size:11px;color:var(--muted);font-weight:500;position:relative;z-index:1}
    .card-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:flex-end}
    .btn-conclude{background:#e0f7ee;color:#0d9f6e;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
    .btn-conclude:hover{background:#c8efdc}
    .topbar{box-shadow:0 1px 8px rgba(10,42,94,.06)}
    .brand-icon{font-size:20px}
    .content{padding-top:22px}
    .pay-card,.card,.stat,.route-row{border-color:#cfe0f0}
    .btn-primary{letter-spacing:.2px}
    .brand-banner{width:100%;display:block;border-radius:16px;margin:0 0 22px;box-shadow:0 8px 24px rgba(4,45,95,.16);border:1px solid rgba(0,180,255,.25)}
    .countdown-card{background:linear-gradient(120deg,#06285a,#087fc4 68%,#00bce8);color:#fff;border:0;position:relative;overflow:hidden}
    .countdown-card:after{content:'❄';position:absolute;right:18px;top:-22px;font-size:112px;color:rgba(255,255,255,.09);pointer-events:none}
    .countdown-card .count-label,.countdown-card .count-sub{color:#d8f4ff}
    .countdown-card .count-number{font-size:24px;font-weight:800;color:#fff}
    .backup-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .history-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eef3f8}
    .history-row:last-child{border-bottom:0}
    .history-row small{display:block;color:var(--muted);font-size:11px}
    @media(max-width:800px){.brand-banner{border-radius:12px;margin-bottom:16px}.countdown-card .count-number{font-size:21px}}

  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">❄</div>
      <div><strong>BESSA</strong><span>REFRIGERAÇÃO</span></div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" data-page="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg> Visão geral</button>
      <button class="nav-btn" data-page="installations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Instalações</button>
      <button class="nav-btn" data-page="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Mapa e rotas</button>
      <button class="nav-btn" data-page="materials"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Materiais</button>
      <button class="nav-btn" data-page="payments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> Pagamentos</button>
    </nav>
    <div class="sidebar-footer">Bessa Refrigeração<br><small style="opacity:.85">Instalação · Manutenção · Conserto</small><br><small style="opacity:.65">Camocim – CE</small></div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div><span class="eyebrow">GESTÃO OPERACIONAL</span><h1 id="pageTitle">Visão geral</h1></div>
      </div>
      <button class="btn btn-primary btn-sm" id="btnNewTop">+ Nova</button>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
const EMPLOYEES=['Elinsberg','Ronaldo','Alex','Bessa'];
const MATERIALS=['Manifold','Bomba de vácuo','Nitrogênio / teste de pressão','Chaves reguláveis','Parafusadeira','Furadeira e brocas','Tubulação de cobre','Isolamento térmico','Cabo PP / cabos elétricos','Mangueira de dreno','Suporte da condensadora','Parafusos e buchas','Fita PVC / fita elastomérica','Porcas e conexões','Canaleta','Disjuntor','Flangeador','Cortador de tubos','Nível','Escada','EPIs'];
const STATUS={saved:'Salva',scheduled:'Agendada',in_progress:'Em andamento',completed:'Concluída',cancelled:'Cancelada'};
const FIXED_PAY=400,PER_INSTALL=10;
const STORAGE_KEY='bessa_installations_v2',RESET_KEY='bessa_period_resets';

function loadData(){
  try{
    const rows=JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
    // registros antigos "saved" passam a contar como concluídos
    let changed=false;
    rows.forEach(r=>{
      if(r.status==='saved'){r.status='completed';changed=true;}
    });
    if(changed)localStorage.setItem(STORAGE_KEY,JSON.stringify(rows));
    return rows;
  }catch{return[]}
}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function loadResets(){try{return JSON.parse(localStorage.getItem(RESET_KEY))||{}}catch{return{}}}
function saveResets(o){localStorage.setItem(RESET_KEY,JSON.stringify(o))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function todayISO(){return new Date().toLocaleDateString('en-CA')}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function formatDate(iso){if(!iso)return'—';return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR')}
function dayNum(iso){if(!iso)return'—';return new Date(iso+'T12:00:00').getDate()}
function monthShort(iso){if(!iso)return'salva';return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}
function formatMoney(v){return'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function mapsUrl(item){if(item.latitude&&item.longitude)return`https://www.google.com/maps/dir/?api=1&destination=${item.latitude},${item.longitude}`;const q=encodeURIComponent([item.address,item.city].filter(Boolean).join(', '));return`https://www.google.com/maps/search/?api=1&query=${q}`}

function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function getPeriodForDate(baseDate=new Date()){
  const year=baseDate.getFullYear(),month=baseDate.getMonth(),day=baseDate.getDate();
  const first=day<=15;
  const start=new Date(year,month,first?1:16);
  // A segunda quinzena termina no dia 30; em fevereiro, no último dia do mês. Dia 31 é ignorado.
  const nominalEnd=first?15:Math.min(30,new Date(year,month+1,0).getDate());
  const end=new Date(year,month,nominalEnd);
  const closeDate=new Date(end);
  if(closeDate.getDay()===0)closeDate.setDate(closeDate.getDate()-1); // domingo: fecha/paga no sábado
  const key=`${year}-${String(month+1).padStart(2,'0')}-${first?'Q1':'Q2'}`;
  return {start,end,closeDate,startISO:localISO(start),endISO:localISO(end),closeISO:localISO(closeDate),payDay:closeDate.getDate(),key,label:`${formatDate(localISO(start))} até ${formatDate(localISO(end))}`,closeLabel:formatDate(localISO(closeDate)),half:first?1:2};
}
function getCurrentPeriod(){return getPeriodForDate(new Date())}
function getNextFortnightCountdown(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const next=now.getDate()<=15?new Date(now.getFullYear(),now.getMonth(),16):new Date(now.getFullYear(),now.getMonth()+1,1);
  const days=Math.max(0,Math.round((next-today)/86400000));
  return {days,date:next.toLocaleDateString('pt-BR',{day:'2-digit',month:'long'}),start:next};
}
function loadHistory(){try{return JSON.parse(localStorage.getItem('bessa_payroll_history')||'[]')}catch{return[]}}
function saveHistory(rows){localStorage.setItem('bessa_payroll_history',JSON.stringify(rows))}
function archivePeriod(period){
  const history=loadHistory();
  if(history.some(h=>h.periodKey===period.key))return;
  const employees=EMPLOYEES.map(employee=>{
    const jobs=installations.filter(x=>x.status==='completed'&&x.scheduled_for>=period.startISO&&x.scheduled_for<=period.closeISO&&getTeam(x).includes(employee));
    const reset=isPeriodReset(period.key,employee);
    return {employee,fixed:FIXED_PAY,installations:reset?0:jobs.length,bonus:reset?0:jobs.length*PER_INSTALL,total:reset?FIXED_PAY:FIXED_PAY+jobs.length*PER_INSTALL};
  });
  history.unshift({periodKey:period.key,period:period.label,closedAt:new Date().toISOString(),paymentDate:period.closeLabel,employees});
  saveHistory(history);
}
function autoArchivePreviousPeriods(){
  const now=new Date();
  const candidates=[];
  for(let offset=-2;offset<=0;offset++){
    const d=new Date(now.getFullYear(),now.getMonth()+offset,1);
    candidates.push(getPeriodForDate(new Date(d.getFullYear(),d.getMonth(),15)));
    candidates.push(getPeriodForDate(new Date(d.getFullYear(),d.getMonth(),16)));
  }
  candidates.forEach(period=>{if(now>new Date(period.closeISO+'T23:59:59') && !loadHistory().some(h=>h.periodKey===period.key))archivePeriod(period)});
}
function isPeriodReset(periodKey,employee){const r=loadResets();return !!(r[periodKey]&&r[periodKey][employee]) || loadHistory().some(h=>h.periodKey===periodKey)}
function getTeam(item){
  if(Array.isArray(item.team)&&item.team.length)return item.team;
  if(item.employee)return[item.employee];
  return[];
}
function getPeriodInstallations(period,employee){
  if(isPeriodReset(period.key,employee))return[];
  return installations.filter(x=>{
    if(x.status!=='completed')return false;
    if(x.scheduled_for<period.startISO||x.scheduled_for>period.closeISO)return false;
    return getTeam(x).includes(employee);
  })
}

}

function renderInstallations(){
  const filtered=installations.filter(item=>{if(!searchTerm)return true;const t=searchTerm.toLowerCase();return[item.client_name,item.address,item.city,item.notes,item.equipment,...getTeam(item)].filter(Boolean).join(' ').toLowerCase().includes(t)}).sort((a,b)=>((a.scheduled_for||'9999')+(a.scheduled_time||'')).localeCompare((b.scheduled_for||'9999')+(b.scheduled_time||'')));
  content.innerHTML=`
    ${permBannerHTML()}
    <div class="toolbar"><div class="search"><span>🔍</span><input type="search" placeholder="Buscar cliente, endereço ou funcionário..." value="${searchTerm}" oninput="searchTerm=this.value;render()"></div>
    <button class="btn btn-primary" onclick="openForm()">+ Nova instalação</button></div>
    ${filtered.length?`<div class="list">${filtered.map(cardHTML).join('')}</div>`:`<div class="empty"><h3>Nenhum serviço encontrado</h3><p>Tente outra busca ou cadastre uma nova instalação.</p><button class="btn btn-secondary" onclick="openForm()">Cadastrar</button></div>`}
  `;
}

function cardHTML(item){
  const total=item.checklist?.length||0,done=item.checklist?.filter(x=>x.checked).length||0;
  const canConclude=['saved','scheduled','in_progress'].includes(item.status);
  return`<div class="card" style="cursor:default">
    <div class="date-block" onclick="openDetail('${item.id}')" style="cursor:pointer"><strong>${dayNum(item.scheduled_for)}</strong><span>${monthShort(item.scheduled_for)}</span></div>
    <div class="card-body" onclick="openDetail('${item.id}')" style="cursor:pointer">
      <div class="card-title"><h4>${esc(item.client_name)}</h4><span class="status status-${item.status}">${STATUS[item.status]||item.status}</span>${getTeam(item).map(e=>`<span class="employee-tag">${esc(e)}</span>`).join('')}</div>
      <div style="font-size:13px;color:var(--muted)">📍 ${esc([item.address,item.city].filter(Boolean).join(', ')||'Sem endereço')}</div>
      <div class="card-meta"><span>🕐 ${item.scheduled_time||'—'}</span><span>👥 ${getTeam(item).length||0}</span>${item.latitude?'<span>📡 GPS</span>':''}</div>
    </div>
    <div class="card-actions">
      ${canConclude?`<button type="button" class="btn-conclude" onclick="event.stopPropagation();quickComplete('${item.id}')">✓ Concluir</button>`:''}
      <button type="button" class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openDetail('${item.id}')">Detalhes</button>
    </div>
  </div>`;
}
function quickComplete(id){
  const item=installations.find(x=>x.id===id);
  if(!item)return;
  if(!confirm('Marcar esta instalação como concluída?'))return;
  item.status='completed';
  if(!item.scheduled_for)item.scheduled_for=todayISO();

function importBackup(event){
  const file=event.target.files?.[0];if(!file)return;
  const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!Array.isArray(data.installations))throw new Error('Arquivo inválido');if(!confirm('Restaurar este backup? Os dados atuais deste aparelho serão substituídos.'))return;installations=data.installations;saveData(installations);saveResets(data.periodResets||{});saveMaterialChecks(data.materialChecks||{});saveHistory(data.payrollHistory||[]);alert('Backup restaurado com sucesso.');render()}catch(e){alert('Não foi possível restaurar: arquivo inválido ou danificado.')}finally{event.target.value=''}};reader.readAsText(file);
}

function toggleScheduleFields(mode){

async function captureLocation(){
  const btn=document.getElementById('btnGeo'),info=document.getElementById('geoInfo');
  const addressInput=document.querySelector('#modalBg input[name="address"]');
  const cityInput=document.querySelector('#modalBg input[name="city"]');
  if(!navigator.geolocation){alert('Este aparelho não oferece geolocalização.');return}
  btn.textContent='Obtendo localização...';btn.disabled=true;
  navigator.geolocation.getCurrentPosition(async pos=>{
    formGeo={latitude:pos.coords.latitude,longitude:pos.coords.longitude};locationPermission='granted';
    btn.textContent='Buscando endereço...';
    let addressMessage='Coordenadas capturadas. Não foi possível identificar o endereço automaticamente; preencha rua, número e bairro.';
    try{
      const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&lat=${encodeURIComponent(formGeo.latitude)}&lon=${encodeURIComponent(formGeo.longitude)}&accept-language=pt-BR`;
      const response=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!response.ok)throw new Error('Falha na consulta do endereço');
      const data=await response.json();
      const a=data.address||{};
      const road=a.road||a.pedestrian||a.residential||a.footway||a.path||'';
      const house=a.house_number||'';
      const neighbourhood=a.neighbourhood||a.suburb||a.quarter||a.city_district||a.hamlet||'';
      const locality=a.city||a.town||a.village||a.municipality||'';
      const parts=[];
      if(road)parts.push(road);
      if(house)parts.push(`nº ${house}`);
      if(neighbourhood&&!parts.some(x=>x.toLocaleLowerCase('pt-BR')===neighbourhood.toLocaleLowerCase('pt-BR')))parts.push(neighbourhood);
      if(parts.length&&addressInput)addressInput.value=parts.join(', ');
      if(locality&&cityInput)cityInput.value=locality+(a.state?` - ${a.state}`:'');
      if(parts.length){
        addressMessage=house
          ?'Endereço preenchido automaticamente com rua, número e bairro. Confira antes de salvar.'
          :'Rua e bairro preenchidos quando disponíveis. O GPS não identificou o número da casa; confira e complete esse campo antes de salvar.';
      }else if(data.display_name&&addressInput){
        addressInput.value=data.display_name;
        addressMessage='Endereço aproximado preenchido. Confira rua, número e bairro antes de salvar.';
      }
    }catch(error){
      addressMessage='Coordenadas capturadas, mas não foi possível consultar o endereço. Verifique a internet e preencha rua, número e bairro manualmente.';
    }
    btn.textContent='✓ Localização capturada — tocar para atualizar';btn.classList.add('captured');btn.disabled=false;
    info.innerHTML=`Coordenadas: ${formGeo.latitude.toFixed(6)}, ${formGeo.longitude.toFixed(6)}<br><small>${esc(addressMessage)}</small>`;info.classList.add('show');
  },err=>{
    btn.textContent='📍 Capturar minha localização atual';btn.disabled=false;
    let msg='Não foi possível obter a localização.';
    if(err.code===1){locationPermission='denied';msg='Permissão de localização negada.\n\nNo celular: Configurações do navegador → Site → Localização → Permitir.\nNo computador: clique no cadeado ao lado da URL e permita a localização.'}
    if(err.code===2)msg='Localização indisponível. Verifique se o GPS está ligado.';
    if(err.code===3)msg='Tempo esgotado. Tente novamente com o GPS ligado.';
    alert(msg);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}

function saveInstallation(e,editId){
  e.preventDefault();
  e.stopPropagation();
  const form=e.target;
  const fd=new FormData(form);
  const team=fd.getAll('team');
  const entryRadio=form.querySelector('input[name="entry_type"]:checked');
  const entryType=entryRadio?entryRadio.value:(fd.get('entry_type')||'scheduled');
  const client_name=(fd.get('client_name')||'').trim();
  const phone=(fd.get('phone')||'').trim();
  const equipment=(fd.get('equipment')||'').trim();
  let scheduled_for=(fd.get('scheduled_for')||'').trim();
  let scheduled_time=(fd.get('scheduled_time')||'').trim();
  const city=(fd.get('city')||'').trim();
  const address=(fd.get('address')||'').trim();
  const notes=(fd.get('notes')||'').trim();
  if(!client_name){alert('Informe o nome do cliente.');return}
  if(!address){alert('Informe o endereço.');return}
  if(team.length<1){alert('Selecione pelo menos 1 pessoa da equipe.');return}
  if(team.length>4){alert('No máximo 4 pessoas por instalação.');return}
  if(!scheduled_for){
    alert(entryType==='completed'?'Informe a data em que o serviço foi feito.':'Informe a data do agendamento.');
    return;
  }
  // Somente salvar = já realizado e concluído (conta no saldo e nas manutenções)
  const statusOnSave = entryType==='completed' ? 'completed' : 'scheduled';
  const payload={
    client_name,phone,equipment,scheduled_for,scheduled_time,city,address,notes,
    team,
    latitude:formGeo?.latitude??null,
    longitude:formGeo?.longitude??null
  };
  if(editId){
    const idx=installations.findIndex(x=>x.id===editId);
    if(idx>=0){
      const prev=installations[idx];
      let nextStatus=prev.status;
      // Only change status when user explicitly picks type and current is not in_progress/cancelled mid-work unless completing
      if(entryType==='completed') nextStatus='completed';
      else if(entryType==='scheduled'&&(prev.status==='saved'||prev.status==='completed'||prev.status==='scheduled')) nextStatus='scheduled';
      installations[idx]={...prev,...payload,status:nextStatus,latitude:payload.latitude??prev.latitude??null,longitude:payload.longitude??prev.longitude??null};
      delete installations[idx].employee;
    }
  }else{
    installations.push({
      id:uid(),
      ...payload,
      status:statusOnSave,
      created_at:new Date().toISOString(),
      checklist:MATERIALS.map(name=>({name,checked:false}))
    });
  }
  try{
    saveData(installations);
  }catch(err){
    alert('Não foi possível salvar no aparelho. Espaço insuficiente ou modo privado.');
    return;
  }
  formGeo=null;
  closeModal();
  currentPage='installations';
  render();
}

function esc(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{currentPage=btn.dataset.page;closeSidebar();render()}));
document.getElementById('btnNewTop').addEventListener('click',()=>openForm());
const sidebar=document.getElementById('sidebar'),overlay=document.getElementById('overlay');
document.getElementById('menuToggle').addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show')});
overlay.addEventListener('click',closeSidebar);
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show')}
render();
</script>
